<script>
(function () {
  "use strict";

  const TAX_BANDS = [
    [350, 700, 1050],
    [2300, 3200, 4100],
    [5950, 6900, 7850],
    [10350, 11900, 13450],
    [18750, 22500, 26250],
    [35000, 40000, 45000],
    [62500, 75000, 87500],
    [105000, 125000, 150000]
  ];

  const RENT = [
    [40, 60],
    [60, 80],
    [80, 100],
    [100, 120],
    [120, 150],
    [150, 200],
    [200, 250]
  ];

  const OTHER = [
    [0, 10],
    [10, 20],
    [20, 30],
    [30, 50],
    [50, 80]
  ];

  function $(id) {
    return document.getElementById(id);
  }

  function midpoint(arr) {
    return (arr[0] + arr[1]) / 2;
  }

  function money(value) {
    if (!Number.isFinite(value)) {
      return "-";
    }

    const rounded = Math.round(value);

    if (rounded >= 10000) {
      return (
        (rounded / 10000).toLocaleString("ko-KR", {
          maximumFractionDigits: 2
        }) + "억원"
      );
    }

    return rounded.toLocaleString("ko-KR") + "만원";
  }

  function pct(value) {
    if (!Number.isFinite(value)) {
      return "-";
    }

    return (value * 100).toFixed(1) + "%";
  }


  /* ===========================
     종합소득세
  =========================== */

  function incomeTax(x) {
    x = Math.max(0, x);

    if (x <= 1400) {
      return x * 0.06;
    }

    if (x <= 5000) {
      return 84 + (x - 1400) * 0.15;
    }

    if (x <= 8800) {
      return 624 + (x - 5000) * 0.24;
    }

    if (x <= 15000) {
      return 1536 + (x - 8800) * 0.35;
    }

    if (x <= 30000) {
      return 3706 + (x - 15000) * 0.38;
    }

    if (x <= 50000) {
      return 9406 + (x - 30000) * 0.40;
    }

    if (x <= 100000) {
      return 17406 + (x - 50000) * 0.42;
    }

    return 38406 + (x - 100000) * 0.45;
  }


  /* ===========================
     개인지방소득세
  =========================== */

  function localTax(x) {
    x = Math.max(0, x);

    if (x <= 1400) {
      return x * 0.006;
    }

    if (x <= 5000) {
      return 8.4 + (x - 1400) * 0.015;
    }

    if (x <= 8800) {
      return 62.4 + (x - 5000) * 0.024;
    }

    if (x <= 15000) {
      return 153.6 + (x - 8800) * 0.035;
    }

    if (x <= 30000) {
      return 370.6 + (x - 15000) * 0.038;
    }

    if (x <= 50000) {
      return 940.6 + (x - 30000) * 0.040;
    }

    if (x <= 100000) {
      return 1740.6 + (x - 50000) * 0.042;
    }

    return 3840.6 + (x - 100000) * 0.045;
  }


  function totalTax(x) {
    return incomeTax(x) + localTax(x);
  }


  function taxSaving(taxBase, deductible) {
    const beforeTax = totalTax(taxBase);

    const afterTax = totalTax(
      Math.max(0, taxBase - deductible)
    );

    return Math.max(
      0,
      beforeTax - afterTax
    );
  }


  /* ===========================
     차량 관련비용
  =========================== */

  function vehicleCalc(
    rentMonthly,
    otherMonthly,
    months,
    record,
    extra,
    insurance
  ) {

    const rent = rentMonthly * months;
    const other = otherMonthly * months;
    const total = rent + other;

    const recordLimit =
      1500 * months / 12;

    const depreciationLimit =
      800 * months / 12;


    /*
      추가 차량인데 보험 요건 미충족
    */

    if (extra && !insurance) {
      return {
        total: total,
        rent: rent,
        other: other,
        recordLimit: recordLimit,
        depreciationLimit: depreciationLimit,

        businessRate: 0,

        dep: 0,
        depAllowed: 0,
        depCarry: 0,

        deductible: 0,

        blocked: true
      };
    }


    /*
      업무사용비율
    */

    let businessRate;

    if (record === "none") {

      if (total <= recordLimit) {
        businessRate = 1;
      } else {
        businessRate =
          recordLimit / total;
      }

    } else {

      businessRate =
        Number(record);

    }


    const businessExpense =
      total * businessRate;


    /*
      장기렌트료 중
      감가상각비 상당액 70%
    */

    const dep =
      rent *
      0.70 *
      businessRate;


    const depAllowed =
      Math.min(
        dep,
        depreciationLimit
      );


    const depCarry =
      Math.max(
        0,
        dep - depreciationLimit
      );


    /*
      당해 필요경비
    */

    const deductible =
      Math.max(
        0,
        businessExpense - depCarry
      );


    return {
      total: total,
      rent: rent,
      other: other,

      recordLimit: recordLimit,
      depreciationLimit: depreciationLimit,

      businessRate: businessRate,

      dep: dep,
      depAllowed: depAllowed,
      depCarry: depCarry,

      deductible: deductible,

      blocked: false
    };
  }


  /* ===========================
     현재 입력조건
  =========================== */

  function getState() {
    return {
      taxBand:
        Number(
          $("taxBand").value
        ),

      rentBand:
        Number(
          $("rentBand").value
        ),

      otherBand:
        Number(
          $("otherBand").value
        ),

      months:
        Number(
          $("months").value
        ),

      record:
        $("record").value,

      extra:
        $("carCount").value ===
        "extra",

      insurance:
        $("insurance").value ===
        "yes",

      bookType:
        $("bookType").value
    };
  }


  function rentLabel(index) {
    const band =
      RENT[index];

    return (
      band[0] +
      " ~ " +
      band[1] +
      "만원"
    );
  }


  /* ===========================
     결과 판정
  =========================== */

  function renderVerdict(
    state,
    result
  ) {

    const verdict =
      $("verdict");


    if (
      state.bookType ===
      "unknown"
    ) {

      verdict.className =
        "verdict warn";

      verdict.innerHTML =
        "<strong>장부유형 확인이 필요합니다.</strong>" +
        "이 계산기는 복식부기의무자를 기준으로 설계했습니다.";

      return;
    }


    if (result.blocked) {

      verdict.className =
        "verdict danger";

      verdict.innerHTML =
        "<strong>추가 차량의 보험 요건 확인이 필요합니다.</strong>" +
        "현재 선택에서는 필요경비 인정액을 0원으로 계산했습니다.";

      return;
    }


    const issues = [];


    if (result.depCarry > 0) {

      issues.push(
        "감가상각비 상당액 " +
        money(result.depCarry) +
        " 이월 예상"
      );

    }


    if (
      state.record === "none" &&
      result.total >
      result.recordLimit
    ) {

      issues.push(
        "업무사용비율 " +
        pct(
          result.businessRate
        ) +
        " 적용"
      );

    }


    if (issues.length > 0) {

      verdict.className =
        "verdict warn";

      verdict.innerHTML =
        "<strong>세무상 한도에 걸리는 구간입니다.</strong>" +
        issues.join(" · ");

    } else {

      verdict.className =
        "verdict good";

      verdict.innerHTML =
        "<strong>주요 당해연도 한도 안쪽입니다.</strong>" +
        "현재 조건에서는 주요 업무용승용차 비용 한도에 걸리지 않습니다.";

    }
  }


  /* ===========================
     렌트료별 비교
  =========================== */

  function renderComparison(
    state
  ) {

    const tbody =
      $("compareBody");

    tbody.innerHTML =
      "";


    const base =
      TAX_BANDS[
        state.taxBand
      ][1];


    const other =
      midpoint(
        OTHER[
          state.otherBand
        ]
      );


    RENT.forEach(
      function (
        band,
        index
      ) {

        const rent =
          midpoint(band);


        const result =
          vehicleCalc(
            rent,
            other,

            state.months,
            state.record,
            state.extra,
            state.insurance
          );


        const saving =
          taxSaving(
            base,
            result.deductible
          );


        const net =
          result.total -
          saving;


        const tr =
          document.createElement(
            "tr"
          );


        if (
          index ===
          state.rentBand
        ) {

          tr.className =
            "active-row";

        }


        let tag = "";

        if (
          index ===
          state.rentBand
        ) {

          tag =
            ' <span class="badge">현재 선택</span>';

        }


        tr.innerHTML =
          "<td>" +
          rentLabel(index) +
          tag +
          "</td>" +

          "<td>" +
          money(rent) +
          "</td>" +

          "<td>" +
          money(result.total) +
          "</td>" +

          "<td>" +
          money(
            result.deductible
          ) +
          "</td>" +

          "<td>" +
          money(saving) +
          "</td>" +

          "<td><b>" +
          money(net) +
          "</b></td>";


        tbody.appendChild(tr);

      }
    );
  }


  /* ===========================
     최고의 절세안
  =========================== */

  function findBestPlan(
    state
  ) {

    const base =
      TAX_BANDS[
        state.taxBand
      ][1];


    const other =
      midpoint(
        OTHER[
          state.otherBand
        ]
      );


    const candidates =
      RENT.map(
        function (
          band,
          index
        ) {

          const rent =
            midpoint(band);


          const result =
            vehicleCalc(
              rent,
              other,

              state.months,
              state.record,
              state.extra,
              state.insurance
            );


          const saving =
            taxSaving(
              base,
              result.deductible
            );


          const net =
            result.total -
            saving;


          let deductionRate =
            0;


          if (
            result.total >
            0
          ) {

            deductionRate =
              result.deductible /
              result.total;

          }


          /*
            세무효율 우수 조건

            1. 보험 문제 없음
            2. 업무사용비율 100%
            3. 감가상각 상당액 이월 없음
            4. 비용인정률 100%
          */

          const efficient =
            !result.blocked &&
            result.businessRate >= 0.999 &&
            result.depCarry < 0.01 &&
            deductionRate >= 0.999;


          return {
            index: index,
            rent: rent,

            result: result,

            saving: saving,
            net: net,

            deductionRate:
              deductionRate,

            efficient:
              efficient
          };

        }
      );


    const efficientList =
      candidates.filter(
        function (item) {
          return item.efficient;
        }
      );


    let best;


    /*
      한도 안쪽 후보가 있으면
      그중 절세액 최대
    */

    if (
      efficientList.length >
      0
    ) {

      best =
        efficientList[0];


      efficientList.forEach(
        function (item) {

          if (
            item.saving >
            best.saving
          ) {

            best =
              item;

          }

        }
      );

    }


    /*
      한도 안쪽 후보가 없으면

      1. 비용인정률
      2. 절세액
      3. 세후 실부담

      순서
    */

    else {

      candidates.sort(
        function (a, b) {

          if (
            Math.abs(
              b.deductionRate -
              a.deductionRate
            ) >
            0.001
          ) {

            return (
              b.deductionRate -
              a.deductionRate
            );

          }


          if (
            Math.abs(
              b.saving -
              a.saving
            ) >
            0.01
          ) {

            return (
              b.saving -
              a.saving
            );

          }


          return (
            a.net -
            b.net
          );

        }
      );


      best =
        candidates[0];

    }


    return {
      best: best,
      candidates:
        candidates
    };
  }


  function renderBestPlan(
    state
  ) {

    const data =
      findBestPlan(
        state
      );


    const best =
      data.best;


    /*
      현재 선택차량 찾기
    */

    let current =
      null;


    data.candidates.forEach(
      function (item) {

        if (
          item.index ===
          state.rentBand
        ) {

          current =
            item;

        }

      }
    );


    $("bestRent")
      .textContent =
      rentLabel(
        best.index
      );


    $("bestSaving")
      .textContent =
      money(
        best.saving
      );


    $("bestNet")
      .textContent =
      money(
        best.net
      );


    $("bestDeductionRate")
      .textContent =
      pct(
        best.deductionRate
      );


    if (
      best.efficient
    ) {

      $("bestRentComment")
        .textContent =
        "주요 세무 한도에 걸리지 않으면서 당해 비용처리 효과를 최대화하는 구간";


      $("bestReason")
        .innerHTML =

        "<strong>왜 이 구간을 추천하나요?</strong>" +

        "업무사용비율 " +

        pct(
          best.result
          .businessRate
        ) +

        ", 비용인정률 " +

        pct(
          best.deductionRate
        ) +

        "이며 감가상각비 상당액 이월이 없는 후보 중 " +

        "예상 절세액이 가장 큰 구간입니다.";

    } else {

      $("bestRentComment")
        .textContent =
        "현재 조건에서 비용인정률과 절세효과를 종합한 추천 구간";


      $("bestReason")
        .innerHTML =

        "<strong>왜 이 구간을 추천하나요?</strong>" +

        "현재 입력조건에서는 모든 비용을 당해연도에 100% 인정받으면서 " +

        "감가상각비 상당액 이월까지 피할 수 있는 후보가 없어 " +

        "비용인정률 → 절세액 → 세후 실부담 순으로 비교했습니다.";

    }


    if (
      current &&
      best.index ===
      state.rentBand
    ) {

      $("bestCompare")
        .textContent =

        "✓ 현재 선택한 " +

        rentLabel(
          state.rentBand
        ) +

        " 구간이 추천 구간과 동일합니다.";

    }


    else if (current) {

      const savingDiff =
        best.saving -
        current.saving;


      const netDiff =
        best.net -
        current.net;


      let text =

        "현재 선택 " +

        rentLabel(
          state.rentBand
        ) +

        " → 추천 " +

        rentLabel(
          best.index
        ) +

        " · 절세액 차이 " +

        money(
          Math.abs(
            savingDiff
          )
        ) +

        " · 세후 실부담 차이 " +

        money(
          Math.abs(
            netDiff
          )
        );


      if (
        netDiff < 0
      ) {

        text +=
          " 감소";

      }


      else if (
        netDiff > 0
      ) {

        text +=
          " 증가";

      }


      $("bestCompare")
        .textContent =
        text;

    }

  }


  /* ===========================
     메인 계산
  =========================== */

  function calculate() {

    try {

      const state =
        getState();


      const rent =
        midpoint(
          RENT[
            state.rentBand
          ]
        );


      const other =
        midpoint(
          OTHER[
            state.otherBand
          ]
        );


      const result =
        vehicleCalc(
          rent,
          other,

          state.months,
          state.record,
          state.extra,
          state.insurance
        );


      const taxBases =
        TAX_BANDS[
          state.taxBand
        ];


      const middleBase =
        taxBases[1];


      const saving =
        taxSaving(
          middleBase,
          result.deductible
        );


      const net =
        result.total -
        saving;


      const savingRanges =
        taxBases.map(
          function (
            taxBase
          ) {

            return taxSaving(
              taxBase,
              result.deductible
            );

          }
        );


      const minSaving =
        Math.min.apply(
          null,
          savingRanges
        );


      const maxSaving =
        Math.max.apply(
          null,
          savingRanges
        );


      /*
        결과 출력
      */

      $("taxSaving")
        .textContent =
        money(
          saving
        );


      $("taxRange")
        .textContent =

        "과세표준 구간 내 예상 " +

        money(
          minSaving
        ) +

        " ~ " +

        money(
          maxSaving
        );


      $("cash")
        .textContent =
        money(
          result.total
        );


      $("deductible")
        .textContent =
        money(
          result.deductible
        );


      let deductionRate =
        0;


      if (
        result.total >
        0
      ) {

        deductionRate =
          result.deductible /
          result.total;

      }


      $("deductibleRate")
        .textContent =

        "총지출의 " +

        pct(
          deductionRate
        );


      $("net")
        .textContent =
        money(
          net
        );


      let savingRate =
        0;


      if (
        result.total >
        0
      ) {

        savingRate =
          saving /
          result.total;

      }


      $("savingRate")
        .textContent =

        "현금지출 대비 세금 감소 " +

        pct(
          savingRate
        );


      $("businessRate")
        .textContent =
        pct(
          result.businessRate
        );


      $("dep")
        .textContent =
        money(
          result.dep
        );


      $("depAllowed")
        .textContent =
        money(
          result.depAllowed
        );


      $("depCarry")
        .textContent =
        money(
          result.depCarry
        );


      /*
        상세 및 추천
      */

      renderVerdict(
        state,
        result
      );


      renderComparison(
        state
      );


      renderBestPlan(
        state
      );


      /*
        화면 표시
      */

      $("placeholder")
        .style
        .display =
        "none";


      $("results")
        .classList
        .add(
          "show"
        );


      $("compareSection")
        .style
        .display =
        "block";


      $("bestPlanSection")
        .style
        .display =
        "block";


      $("dirty")
        .classList
        .remove(
          "show"
        );


      $("status")
        .textContent =
        "계산 완료";


      if (
        window.innerWidth <
        880
      ) {

        $("resultCard")
          .scrollIntoView({
            behavior:
              "smooth",

            block:
              "start"
          });

      }

    }

    catch (error) {

      console.error(
        error
      );


      alert(
        "계산 중 오류가 발생했습니다.\n\n" +
        error.message
      );


      $("status")
        .textContent =
        "오류 발생";

    }

  }


  /* ===========================
     변경 감지
  =========================== */

  function changed() {

    $("dirty")
      .classList
      .add(
        "show"
      );


    if (
      $("results")
      .classList
      .contains(
        "show"
      )
    ) {

      $("status")
        .textContent =
        "조건 변경됨 · 재계산 필요";

    }

  }


  function toggleInsurance() {

    if (
      $("carCount").value ===
      "extra"
    ) {

      $("insuranceArea")
        .style
        .display =
        "flex";

    }

    else {

      $("insuranceArea")
        .style
        .display =
        "none";

    }

  }


  /* ===========================
     초기화
  =========================== */

  function resetAll() {

    $("taxBand").value =
      "3";

    $("rentBand").value =
      "2";

    $("otherBand").value =
      "1";

    $("months").value =
      "12";

    $("record").value =
      "none";

    $("carCount").value =
      "first";

    $("insurance").value =
      "yes";

    $("bookType").value =
      "double";


    toggleInsurance();


    $("dirty")
      .classList
      .remove(
        "show"
      );


    $("results")
      .classList
      .remove(
        "show"
      );


    $("placeholder")
      .style
      .display =
      "grid";


    $("compareSection")
      .style
      .display =
      "none";


    $("bestPlanSection")
      .style
      .display =
      "none";


    $("status")
      .textContent =
      "아직 계산 전";

  }


  /* ===========================
     이벤트
  =========================== */

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      document
        .querySelectorAll(
          "select"
        )
        .forEach(
          function (
            select
          ) {

            select.addEventListener(
              "change",
              function () {

                toggleInsurance();
                changed();

              }
            );

          }
        );


      $("calculateBtn")
        .addEventListener(
          "click",
          calculate
        );


      $("resetBtn")
        .addEventListener(
          "click",
          resetAll
        );


      toggleInsurance();

    }
  );

})();
</script>
